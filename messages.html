<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages - WorkToday</title>

<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif
}

.messages-page{
  width:100%;
  padding:32px 20px 50px
}

.messages-container{
  width:100%;
  max-width:1180px;
  margin:auto
}

.messages-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px
}

.messages-heading h1{
  margin:0;
  font-size:32px;
  font-weight:800
}

.messages-heading p{
  margin:7px 0 0;
  color:#667085;
  font-size:15px
}

.back-link{
  text-decoration:none;
  color:#2563eb;
  font-weight:700;
  font-size:14px
}

.messages-box{
  width:100%;
  height:680px;
  background:white;
  border:1px solid #e4e7ec;
  border-radius:18px;
  overflow:hidden;
  display:grid;
  grid-template-columns:350px minmax(0,1fr);
  box-shadow:0 8px 30px rgba(16,24,40,.07)
}

.conversation-panel{
  min-width:0;
  border-right:1px solid #e4e7ec;
  background:white;
  display:flex;
  flex-direction:column
}

.conversation-header{
  padding:22px 20px 16px;
  border-bottom:1px solid #eef0f4
}

.conversation-header h2{
  margin:0 0 15px;
  font-size:19px
}

.search-box{
  position:relative
}

.search-box input{
  width:100%;
  height:44px;
  border:1px solid #d9dee8;
  border-radius:10px;
  padding:0 14px 0 40px;
  outline:none;
  font-size:14px;
  background:#f8fafc
}

.search-icon{
  position:absolute;
  left:14px;
  top:13px;
  pointer-events:none
}

.conversation-list{
  flex:1;
  overflow-y:auto
}

.conversation{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px 18px;
  border:0;
  border-bottom:1px solid #f0f2f5;
  background:white;
  text-align:left;
  cursor:pointer
}

.conversation:hover{
  background:#f8fafc
}

.conversation.active{
  background:#eff6ff;
  border-left:4px solid #2563eb;
  padding-left:14px
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:#e8eefc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:800;
  color:#2456b8;
  overflow:hidden
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.conversation-info{
  min-width:0;
  flex:1
}

.conversation-name-row{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.conversation-name{
  font-weight:700;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.conversation-time{
  font-size:11px;
  color:#98a2b3;
  white-space:nowrap
}

.conversation-preview{
  margin-top:5px;
  color:#667085;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.unread-count{
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:20px;
  background:#2563eb;
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700
}

.empty-conversations{
  padding:35px 20px;
  text-align:center;
  color:#98a2b3;
  font-size:14px
}

.chat-panel{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#f8fafc
}

.chat-header{
  min-height:76px;
  padding:14px 20px;
  background:white;
  border-bottom:1px solid #e4e7ec;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.chat-person{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}

.chat-person-info{
  min-width:0
}

.chat-person-name{
  margin:0;
  font-size:16px;
  font-weight:800
}

.online-status{
  margin-top:4px;
  font-size:12px;
  color:#16a34a
}

.online-dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#16a34a;
  margin-right:5px
}

.chat-actions{
  display:flex;
  gap:8px
}

.chat-action{
  height:40px;
  min-width:40px;
  padding:0 13px;
  border:1px solid #d9dee8;
  border-radius:9px;
  background:white;
  cursor:pointer;
  font-weight:700
}

.chat-action.primary{
  background:#2563eb;
  border-color:#2563eb;
  color:white
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:25px 24px;
  display:flex;
  flex-direction:column;
  gap:13px
}

.chat-empty{
  margin:auto;
  text-align:center;
  color:#98a2b3;
  font-size:14px
}

.date-divider{
  align-self:center;
  font-size:11px;
  color:#98a2b3;
  background:#e9edf3;
  padding:6px 11px;
  border-radius:20px
}

.message-row{
  display:flex;
  width:100%
}

.message-row.received{
  justify-content:flex-start
}

.message-row.sent{
  justify-content:flex-end
}

.message{
  max-width:min(72%,520px);
  padding:11px 14px;
  border-radius:14px;
  font-size:14px;
  line-height:1.45;
  overflow-wrap:anywhere
}

.message.received{
  background:white;
  border:1px solid #e4e7ec;
  border-bottom-left-radius:5px
}

.message.sent{
  background:#2563eb;
  color:white;
  border-bottom-right-radius:5px
}

.message-time{
  display:block;
  margin-top:5px;
  font-size:10px;
  opacity:.65;
  text-align:right
}

.chat-input-area{
  padding:14px 18px;
  background:white;
  border-top:1px solid #e4e7ec
}

.message-form{
  display:flex;
  align-items:flex-end;
  gap:9px
}

.message-input{
  flex:1;
  min-width:0;
  min-height:46px;
  max-height:120px;
  resize:none;
  border:1px solid #d9dee8;
  border-radius:11px;
  padding:12px 14px;
  outline:none;
  font-family:inherit;
  font-size:14px
}

.message-input:focus{
  border-color:#2563eb
}

.send-button{
  min-width:46px;
  height:46px;
  border:0;
  border-radius:11px;
  background:#2563eb;
  color:white;
  font-size:18px;
  cursor:pointer
}

.send-button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.status-message{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-size:13px;
  display:none;
  z-index:9999
}

@media(max-width:900px){
 .messages-box{
    grid-template-columns:290px minmax(0,1fr)
  }
}

@media(max-width:700px){
 .messages-page{
    padding:20px 12px 30px
  }

 .messages-top{
    flex-direction:column;
    align-items:flex-start;
    gap:8px
  }

 .messages-heading h1{
    font-size:26px
  }

 .messages-box{
    height:auto;
    min-height:650px;
    grid-template-columns:1fr
  }

 .conversation-panel{
    border-right:0
  }

 .conversation-list{
    max-height:270px
  }

 .chat-panel{
    min-height:520px;
    border-top:1px solid #e4e7ec
  }

 .chat-messages{
    min-height:330px;
    padding:18px 13px
  }

 .message{
    max-width:84%;
    font-size:13px
  }

 .chat-input-area{
    padding:10px
  }

 .message-input{
    font-size:16px
  }
}
</style>
</head>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

let supabaseClient = null;
let currentUser = null;
let conversations = [];
let selectedConversation = null;
let realtimeChannel = null;

/* ================================
   HELPERS
================================ */

function getSupabase(){

  if(window.supabaseClient){
    return window.supabaseClient;
  }

  if(window.supabase){
    return window.supabase;
  }

  return null;
}

function showStatus(message){

  const box =
    document.getElementById("statusMessage");

  box.textContent = message;
  box.style.display = "block";

  clearTimeout(window.statusTimer);

  window.statusTimer =
    setTimeout(function(){

      box.style.display = "none";

    },3000);
}

function escapeText(value){

  return String(value || "");
}

function getInitials(name){

  const parts =
    String(name || "User")
   .trim()
   .split(/\s+/)
   .filter(Boolean);

  if(parts.length === 0){
    return "U";
  }

  if(parts.length === 1){
    return parts[0].substring(0,2).toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();
}

function formatTime(dateValue){

  if(!dateValue){
    return "";
  }

  const date =
    new Date(dateValue);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );
}

function formatConversationTime(dateValue){

  if(!dateValue){
    return "";
  }

  const date =
    new Date(dateValue);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  const now = new Date();

  if(
    date.toDateString() ===
    now.toDateString()
  ){
    return formatTime(dateValue);
  }

  return date.toLocaleDateString(
    [],
    {
      day:"2-digit",
      month:"short"
    }
  );
}

/* ================================
   GET CURRENT USER
================================ */

async function getCurrentUser(){

  const client =
    getSupabase();

  if(!client){
    throw new Error(
      "Supabase client nahi mila."
    );
  }

  const result =
    await client.auth.getUser();

  if(result.error){
    throw result.error;
  }

  if(!result.data.user){
    throw new Error(
      "Login required."
    );
  }

  return result.data.user;
}

/* ================================
   LOAD CONVERSATIONS
================================ */

async function loadConversations(){

  const client =
    getSupabase();

  const list =
    document.getElementById(
      "conversationList"
    );

  list.innerHTML =
    '<div class="empty-conversations">Loading conversations...</div>';

  /*
    IMPORTANT:
    Existing conversations table:
    id
    job_id
    customer_id
    worker_id
    created_at
    updated_at
  */

  const { data, error } =
    await client
   .from("conversations")
   .select(
      "id,job_id,customer_id,worker_id,created_at,updated_at"
    )
   .or(
      "customer_id.eq." +
      currentUser.id +
      ",worker_id.eq." +
      currentUser.id
    )
   .order(
      "updated_at",
      {
        ascending:false,
        nullsFirst:false
      }
    );

  if(error){
    console.error(error);

    throw error;
  }

  conversations =
    data || [];

  if(conversations.length === 0){

    list.innerHTML =
      '<div class="empty-conversations">' +
      'No conversations yet.<br><br>' +
      'When someone contacts you about a work, the chat will appear here.' +
      '</div>';

    return;
  }

  /*
    Load the other users' profiles.
  */

  const otherIds =
    conversations.map(function(conversation){

      return conversation.customer_id === currentUser.id
       ? conversation.worker_id
        : conversation.customer_id;

    });

  const uniqueIds =
    [...new Set(otherIds)];

  let profiles = [];

  if(uniqueIds.length > 0){

    const profileResult =
      await client
     .from("profiles")
     .select(
        "id,name,phone,city,profile_photo_url"
      )
     .in(
        "id",
        uniqueIds
      );

    if(profileResult.error){
      console.error(
        profileResult.error
      );
    }else{
      profiles =
        profileResult.data || [];
    }
  }

  conversations =
    conversations.map(function(conversation){

      const otherId =
        conversation.customer_id === currentUser.id
         ? conversation.worker_id
          : conversation.customer_id;

      const profile =
        profiles.find(function(item){
          return item.id === otherId;
        });

      return {
       ...conversation,
        otherId:otherId,
        otherProfile:profile || {
          id:otherId,
          name:"WorkToday User",
          phone:"",
          city:"",
          profile_photo_url:""
        },
        lastMessage:null
      };

    });

  /*
    Get latest message for each conversation.
  */

  for(
    const conversation of conversations
  ){

    const messageResult =
      await client
     .from("messages")
     .select(
        "body,sender_id,created_at"
      )
     .eq(
        "conversation_id",
        conversation.id
      )
     .order(
        "created_at",
        {
          ascending:false
        }
      )
     .limit(1);

    if(
     !messageResult.error &&
      messageResult.data &&
      messageResult.data.length
    ){

      conversation.lastMessage =
        messageResult.data[0];

    }

  }

  conversations.sort(
    function(a,b){

      const aTime =
        a.lastMessage?.created_at ||
        a.updated_at ||
        a.created_at ||
        "";

      const bTime =
        b.lastMessage?.created_at ||
        b.updated_at ||
        b.created_at ||
        "";

      return (
        new Date(bTime) -
        new Date(aTime)
      );

    }
  );

  renderConversations();

  /*
    Automatically open first real conversation.
  */

  if(
    conversations.length > 0 &&
   !selectedConversation
  ){

    await openConversation(
      conversations[0].id
    );

  }

}

/* ================================
   RENDER CONVERSATIONS
================================ */

function renderConversations(){

  const list =
    document.getElementById(
      "conversationList"
    );

  const search =
    document
   .getElementById(
      "conversationSearch"
    )
   .value
   .trim()
   .toLowerCase();

  const filtered =
    conversations.filter(
      function(conversation){

        const name =
          conversation
         .otherProfile
         .name ||
          "WorkToday User";

        return (
         !search ||
          name
         .toLowerCase()
         .includes(search)
        );

      }
    );

  if(filtered.length === 0){

    list.innerHTML =
      '<div class="empty-conversations">No conversations found.</div>';

    return;
  }

  list.innerHTML = "";

  filtered.forEach(
    function(conversation){

      const profile =
        conversation.otherProfile;

      const button =
        document.createElement(
          "button"
        );

      button.type = "button";

      button.className =
        "conversation" +
        (
          selectedConversation &&
          selectedConversation.id ===
          conversation.id
         ? " active"
          : ""
        );

      button.dataset.id =
        conversation.id;

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";

      if(profile.profile_photo_url){

        const img =
          document.createElement(
            "img"
          );

        img.src =
          profile.profile_photo_url;

        img.alt =
          profile.name || "Profile";

        avatar.appendChild(img);

      }else{

        avatar.textContent =
          getInitials(
            profile.name
          );

      }

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "conversation-info";

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "conversation-name-row";

      const name =
        document.createElement(
          "span"
        );

      name.className =
        "conversation-name";

      name.textContent =
        profile.name ||
        "WorkToday User";

      const time =
        document.createElement(
          "span"
        );

      time.className =
        "conversation-time";

      time.textContent =
        formatConversationTime(
          conversation
         .lastMessage
         ?.created_at ||
          conversation.updated_at
        );

      row.appendChild(name);
      row.appendChild(time);

      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "conversation-preview";

      if(conversation.lastMessage){

        preview.textContent =
          (
            conversation.lastMessage
           .sender_id ===
            currentUser.id
           ? "You: "
            : ""
          ) +
          conversation.lastMessage.body;

      }else{

        preview.textContent =
          "Start a conversation";

      }

      info.appendChild(row);
      info.appendChild(preview);

      button.appendChild(avatar);
      button.appendChild(info);

      button.addEventListener(
        "click",
        function(){

          openConversation(
            conversation.id
          );

        }
      );

      list.appendChild(button);

    }
  );

}

/* ================================
   OPEN REAL CONVERSATION
================================ */

async function openConversation(
  conversationId
){

  const client =
    getSupabase();

  const conversation =
    conversations.find(
      function(item){
        return item.id ===
          conversationId;
      }
    );

  if(!conversation){
    return;
  }

  selectedConversation =
    conversation;

  renderConversations();

  const profile =
    conversation.otherProfile;

  const chatName =
    document.getElementById(
      "chatPersonName"
    );

  const chatAvatar =
    document.getElementById(
      "chatAvatar"
    );

  chatName.textContent =
    profile.name ||
    "WorkToday User";

  chatAvatar.innerHTML = "";

  if(profile.profile_photo_url){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      profile.profile_photo_url;

    img.alt =
      profile.name || "Profile";

    chatAvatar.appendChild(img);

  }else{

    chatAvatar.textContent =
      getInitials(
        profile.name
      );

  }

  document
 .getElementById(
    "messageInput"
  )
 .disabled = false;

  document
 .getElementById(
    "sendButton"
  )
 .disabled = false;

  await loadMessages(
    conversation.id
  );

  subscribeRealtime(
    conversation.id
  );

}

/* ================================
   LOAD REAL MESSAGES
================================ */

async function loadMessages(
  conversationId
){

  const client =
    getSupabase();

  const box =
    document.getElementById(
      "chatMessages"
    );

  box.innerHTML =
    '<div class="chat-empty">Loading messages...</div>';

  const { data, error } =
    await client
   .from("messages")
   .select(
      "id,conversation_id,sender_id,body,attachment_path,attachment_type,read_at,created_at"
    )
   .eq(
      "conversation_id",
      conversationId
    )
   .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error){

    console.error(error);

    box.innerHTML =
      '<div class="chat-empty">Messages load nahi ho paaye.</div>';

    return;
  }

  box.innerHTML = "";

  if(!data || data.length === 0){

    box.innerHTML =
      '<div class="chat-empty">No messages yet. Send the first message.</div>';

    return;
  }

  data.forEach(
    function(message){

      addRealMessage(
        message,
        false
      );

    }
  );

  scrollChatToBottom();

  /*
    Mark received messages as read.
  */

  const unreadIds =
    data
   .filter(function(message){

      return (
        message.sender_id!==
        currentUser.id &&
       !message.read_at
      );

    })
   .map(function(message){
      return message.id;
    });

  if(unreadIds.length > 0){

    await client
   .from("messages")
   .update({
      read_at:new Date().toISOString()
    })
   .in(
      "id",
      unreadIds
    );

  }

}

/* ================================
   ADD MESSAGE TO UI
================================ */

function addRealMessage(
  message,
  scroll
){

  const box =
    document.getElementById(
      "chatMessages"
    );

  const empty =
    box.querySelector(
      ".chat-empty"
    );

  if(empty){
    empty.remove();
  }

  const isSent =
    message.sender_id ===
    currentUser.id;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row " +
    (
      isSent
     ? "sent"
      : "received"
    );

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message " +
    (
      isSent
     ? "sent"
      : "received"
    );

  bubble.appendChild(
    document.createTextNode(
      message.body || ""
    )
  );

  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.created_at
    );

  bubble.appendChild(time);

  row.appendChild(bubble);

  box.appendChild(row);

  if(scroll){
    scrollChatToBottom();
  }

}

/* ================================
   SEND REAL MESSAGE
================================ */

async function sendMessage(){

  if(
   !selectedConversation ||
   !currentUser
  ){
    return;
  }

  const client =
    getSupabase();

  const input =
    document.getElementById(
      "messageInput"
    );

  const sendButton =
    document.getElementById(
      "sendButton"
    );

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  sendButton.disabled = true;

  const optimisticId =
    "temp-" +
    Date.now();

  /*
    Insert directly into real
    public.messages table.
  */

  const { data, error } =
    await client
   .from("messages")
   .insert({
      conversation_id:
        selectedConversation.id,

      sender_id:
        currentUser.id,

      body:
        text
    })
   .select(
      "id,conversation_id,sender_id,body,attachment_path,attachment_type,read_at,created_at"
    )
   .single();

  if(error){

    console.error(error);

    showStatus(
      "Message send nahi hua: " +
      error.message
    );

    sendButton.disabled = false;

    return;
  }

  /*
    Realtime event usually adds this
    message automatically.
    Add here immediately only if
    realtime has not already rendered it.
  */

  if(data){

    const alreadyShown =
      document.querySelector(
        '[data-message-id="' +
        data.id +
        '"]'
      );

    if(!alreadyShown){

      addRealMessage(
        data,
        true
      );

    }

  }

  input.value = "";

  sendButton.disabled = false;

  /*
    Move conversation to top.
  */

  const index =
    conversations.findIndex(
      function(item){
        return item.id ===
          selectedConversation.id;
      }
    );

  if(index!== -1){

    conversations[index].lastMessage =
      data;

    conversations[index].updated_at =
      data.created_at;

    conversations.sort(
      function(a,b){

        const aTime =
          a.lastMessage?.created_at ||
          a.updated_at ||
          a.created_at;

        const bTime =
          b.lastMessage?.created_at ||
          b.updated_at ||
          b.created_at;

        return (
          new Date(bTime) -
          new Date(aTime)
        );

      }
    );

    renderConversations();

  }

}

/* ================================
   REALTIME
================================ */

function subscribeRealtime(
  conversationId
){

  const client =
    getSupabase();

  if(realtimeChannel){

    try{
      client.removeChannel(
        realtimeChannel
      );
    }catch(e){}

    realtimeChannel =
      null;
  }

  realtimeChannel =
    client
   .channel(
      "worktoday-chat-" +
      conversationId
    )
   .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages",
        filter:
          "conversation_id=eq." +
          conversationId
      },
      function(payload){

        const message =
          payload.new;

        /*
          Do not duplicate own message.
        */

        if(
          message.sender_id ===
          currentUser.id
        ){

          return;

        }

        /*
          Only show message for the
          currently selected conversation.
        */

        if(
          selectedConversation &&
          selectedConversation.id ===
          message.conversation_id
        ){

          addRealMessage(
            message,
            true
          );

          markMessageRead(
            message.id
          );

        }

        /*
          Update conversation preview.
        */

        const conversation =
          conversations.find(
            function(item){
              return item.id ===
                message.conversation_id;
            }
          );

        if(conversation){

          conversation.lastMessage =
            message;

          conversation.updated_at =
            message.created_at;

          conversations.sort(
            function(a,b){

              const aTime =
                a.lastMessage?.created_at ||
                a.updated_at ||
                a.created_at;

              const bTime =
                b.lastMessage?.created_at ||
                b.updated_at ||
                b.created_at;

              return (
                new Date(bTime) -
                new Date(aTime)
              );

            }
          );

          renderConversations();

        }

      }
    )
   .subscribe(
      function(status){

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}

async function markMessageRead(
  messageId
){

  const client =
    getSupabase();

  await client
 .from("messages")
 .update({
    read_at:
      new Date().toISOString()
  })
 .eq(
    "id",
    messageId
  )
 .eq(
    "sender_id",
    selectedConversation
   ? selectedConversation.otherId
    : ""
  );

}

/* ================================
   CALL
================================ */

document
.getElementById("callBtn")
.addEventListener(
  "click",
  async function(){

    if(
     !selectedConversation ||
     !selectedConversation.otherProfile
    ){

      showStatus(
        "Pehle conversation select karo."
      );

      return;

    }

    const phone =
      selectedConversation
     .otherProfile
     .phone;

    if(!phone){

      showStatus(
        "Is user ka phone number available nahi hai."
      );

      return;

    }

    window.location.href =
      "tel:" + phone;

  }
);

/* ================================

================================ */

document
.getElementById("viewProfileBtn")
.addEventListener(
  "click",
  function(){

    if(
     !selectedConversation ||
     !selectedConversation.otherId
    ){

      showStatus(
        "Pehle conversation select karo."
      );

     ?id=USER_ID

      );

);

document

.addEventListener(

);

   START
================================ */

async function startMessages(){

  try{

    /*
      Use existing WorkToday auth.
    */

    currentUser =
      await getCurrentUser();

    await loadConversations();

  }catch(error){

    console.error(error);

    document
   .getElementById(
      "conversationList"
    )
   .innerHTML =
      '<div class="empty-conversations">' +
      'Login/session error.<br><br>' +
      escapeText(
        error.message
      ) +
      '</div>';

    showStatus(
      "Login/session error."
    );

  }

}

startMessages();
